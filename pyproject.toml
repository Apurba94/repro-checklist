[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repro-checklist"
version = "0.1.0"
description = "Interactive reproducibility checklist (data, code, compute) producing a Markdown report."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
repro-checklist = "repro_checklist.cli:main"

[tool.setuptools]
packages = ["repro_checklist"]
